<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="projects.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
  <title>My Portfolio</title>
  <style>
    /* Project Grid Styling */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .project {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      padding: 1rem;
      text-align: center;
    }

    .project:hover {
      background-color: #f0f0f0;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
      font-family: 'JetBrains Mono', monospace;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }

    .modal-close:hover {
      color: #000;
    }

    @media (max-width: 600px) {
      .modal-content {
        padding: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <script src="glow.js"></script>

  <div class="nav-wrapper">
    <nav class="nav">
      <a href="index.html"><img src="home.svg" />Home</a>
      <a href="about.html"><img src="about.svg" />About</a>
      <a href="projects.html"><img src="projects.svg" />Projects</a>
      <a href="contact.html"><img src="contact.svg" />Contact</a>
      <!--<a href="photos.html"><img src="photos.svg" />Photos</a> -->
      <a href="clips.html"><img src="photos.svg" />Esports</a>
    </nav>
  </div>

  <main class="main-content">
    <h1>My Projects</h1>

    <div class="grid">
      <div class="project" onclick="openModal('Project 1', 'This is a description of Project 1. It involved using React, Node.js, and MongoDB to build a full-stack application.')">
        <h2>Project 1</h2>
      </div>

      <div class="project" onclick="openModal('Project 2', 'This project was a Python data analysis tool using pandas and matplotlib to visualize datasets interactively.')">
        <h2>Project 2</h2>
      </div>

      <div class="project" onclick="openModal('Project 3', 'This mobile app was built with Flutter and integrated with Firebase for authentication and storage.')">
        <h2>Project 3</h2>
      </div>

      <!-- Add more project blocks here -->
    </div>
  </main>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">Project Title</h2>
      <p id="modalDescription">Project description will go here.</p>
    </div>
  </div>

  <script>
    function openModal(title, description) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDescription').textContent = description;
      document.getElementById('projectModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('projectModal').classList.remove('active');
    }

    // Optional: close modal when clicking outside content
    document.getElementById('projectModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
