<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="projects.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
  <title>My Portfolio</title>
  <style>
    /* Project Grid Styling */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .project {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      padding: 1rem;
      text-align: center;
      margin-left: 20px;
    }

    .project h2 {
      font-size: 1.1rem;
      margin: 0;
    }

    .project-icon {
      width: 100%;       /* fills the container’s width */
      height: auto;      /* keeps aspect ratio */
      object-fit: contain; /* ensures image doesn’t stretch weirdly */
      margin-bottom: 0.5rem;
      border-radius: 6px; /* optional, for nice rounded corners */
    }
    
    .project:hover {
      background-color: #f0f0f0;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh; 
      overflow-y: auto;  
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
      font-family: 'JetBrains Mono', monospace;
      position: relative;
      transform: scale(0.95);
      opacity: 0;
      transition: all 0.25s ease;
       text-align: left;
    }


    .modal-overlay.active .modal-content {
      transform: scale(1);
      opacity: 1;
    }
    
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }

    .modal-close:hover {
      color: #000;
    }

    body.modal-open {
      overflow: hidden;
    }

    .modal-image-gallery {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .modal-thumb {
      width: 100px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }
    
    .modal-thumb:hover {
      transform: scale(1.05);
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    .lightbox-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1100;
    }
    
    .lightbox-overlay img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }
    
    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 2.5rem;
      color: white;
      cursor: pointer;
      user-select: none;
      z-index: 1101;
    }
    
    .modal-thumb,
    .modal-video-thumb {
      width: 100px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }
    
    .modal-video-thumb:hover {
      transform: scale(1.05);
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    @media (max-width: 600px) {
      .modal-content {
        padding: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <script src="glow.js"></script>

  <div class="nav-wrapper">
    <nav class="nav">
      <a href="index.html"><img src="home.svg" />Home</a>
      <a href="about.html"><img src="about.svg" />About</a>
      <a href="projects.html"><img src="projects.svg" />Projects</a>

  <main class="main-content">
    <h1>My Projects</h1>

    <div class="grid">
      <div class="project" onclick="openModal('Databricks File Management and Processing Dashboard', databricksModalContent)">
        <h2>Databricks Dashboard</h2>
        <img src="databricks.png" alt="Databricks Icon" class="project-icon" />

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="projectModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div id="modalContentArea"></div>
    </div>
  </div>

  <script>
    function openModal(title, htmlContent) {
      document.getElementById('modalContentArea').innerHTML = `
        <h2>${title}</h2>
        ${htmlContent}
      `;
      document.getElementById('projectModal').classList.add('active');
    }
  
    function closeModal() {
      document.getElementById('projectModal').classList.remove('active');
    }
  
    document.getElementById('projectModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('click', function(event) {
      const lightboxOverlay = document.getElementById('lightboxOverlay');
      const img = document.getElementById('lightboxImage');
      const vid = document.getElementById('lightboxVideo');
    
      if (event.target.classList.contains('modal-thumb')) {
        img.src = event.target.getAttribute('src');
        img.style.display = 'block';
        vid.style.display = 'none';
        lightboxOverlay.style.display = 'flex';
      } else if (event.target.classList.contains('modal-video-thumb')) {
        vid.src = event.target.getAttribute('src');
        vid.style.display = 'block';
        img.style.display = 'none';
        lightboxOverlay.style.display = 'flex';
      }
    });
    
    function closeLightbox() {
      const lightboxOverlay = document.getElementById('lightboxOverlay');
      document.getElementById('lightboxImage').style.display = 'none';
      document.getElementById('lightboxVideo').pause(); // Stop video playback
      document.getElementById('lightboxVideo').src = '';
      document.getElementById('lightboxVideo').style.display = 'none';
      lightboxOverlay.style.display = 'none';
    }

    // Also close lightbox when clicking outside the image
    document.getElementById('lightboxOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox();
    });

  </script>
