<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="projects.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
  <title>My Portfolio</title>
  <style>
    /* Project Grid Styling */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .project {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      padding: 1rem;
      text-align: center;
    }

    .project h2 {
      font-size: 1.1rem;
      margin: 0;
    }

    .project-icon {
      width: 100%;       /* fills the container’s width */
      height: auto;      /* keeps aspect ratio */
      object-fit: contain; /* ensures image doesn’t stretch weirdly */
      margin-bottom: 0.5rem;
      border-radius: 6px; /* optional, for nice rounded corners */
    }
    
    .project:hover {
      background-color: #f0f0f0;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh; 
      overflow-y: auto;  
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
      font-family: 'JetBrains Mono', monospace;
      position: relative;
      transform: scale(0.95);
      opacity: 0;
      transition: all 0.25s ease;
       text-align: left;
    }


    .modal-overlay.active .modal-content {
      transform: scale(1);
      opacity: 1;
    }
    
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }

    .modal-close:hover {
      color: #000;
    }

    body.modal-open {
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .modal-content {
        padding: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <script src="glow.js"></script>

  <div class="nav-wrapper">
    <nav class="nav">
      <a href="index.html"><img src="home.svg" />Home</a>
      <a href="about.html"><img src="about.svg" />About</a>
      <a href="projects.html"><img src="projects.svg" />Projects</a>
      <a href="contact.html"><img src="contact.svg" />Contact</a>
      <!--<a href="photos.html"><img src="photos.svg" />Photos</a> -->
      <a href="clips.html"><img src="photos.svg" />Esports</a>
    </nav>
  </div>

  <main class="main-content">
    <h1>My Projects</h1>

    <div class="grid">
      <div class="project" onclick="openModal('Databricks File Management and Processing Dashboard', databricksModalContent)">
        <h2>Databricks Dashboard</h2>
        <img src="databricks.png" alt="Databricks Icon" class="project-icon" />
      </div>


      <div class="project" onclick="openModal('Project 2', 'This project was a Python data analysis tool using pandas and matplotlib to visualize datasets interactively.')">
        <h2>Project 2</h2>
      </div>

      <div class="project" onclick="openModal('Project 3', 'This mobile app was built with Flutter and integrated with Firebase for authentication and storage.')">
        <h2>Project 3</h2>
      </div>

      <!-- Add more project blocks here -->
    </div>
  </main>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="projectModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div id="modalContentArea"></div>
    </div>
  </div>

  <script>
    function openModal(title, htmlContent) {
      document.getElementById('modalContentArea').innerHTML = `
        <h2>${title}</h2>
        ${htmlContent}
      `;
      document.getElementById('projectModal').classList.add('active');
    }
  
    function closeModal() {
      document.getElementById('projectModal').classList.remove('active');
    }
  
    document.getElementById('projectModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
  </script>
  <script>
  const databricksModalContent = `

      <li>Displays up to 5 recent update logs with:
        <ul>
          <li>Update ID</li>
          <li>State (e.g., RUNNING, FAILED)</li>

      </li>
      <li>Includes a <strong>custom animated truck graphic</strong> that activates during pipeline execution</li>

    <ul>
      <li>Allows users to select a document type and delete files from Databricks Volumes</li>

    </ul>

    <h5>4. Interactive Help / Documentation</h5>
    <ul>

    </ul>

    <h4>Outcomes</h4>

      <li>Empowered users to manage workflows without needing Databricks access</li>
      <li>Eliminated the need for manual notebook execution or CLI commands</li>

      <li>Delivered a production-ready, highly maintainable solution</li>
    </ul>

    <h4>Technologies Used</h4>

      <li>Python 3</li>

      <li>Delta Live Tables (DLT)</li>
      <li>Databricks Unity Catalog Volumes</li>
      <li>YAML Configuration</li>
      <li>dcc.Store, dcc.Upload, dcc.Interval</li>
    </ul>
  `;
</script>
