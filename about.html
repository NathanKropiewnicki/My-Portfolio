        <style>
            .grid {
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
              gap: 1.5rem;
              margin-top: 2rem;
            }
            
           .modal-overlay {
              display: none;
              position: relative; /* Not fixed */
              z-index: 1;
              margin-top: 1rem;
            }
            
            .modal-overlay.active {
            display: block;
            }
            
            .modal-content {
              background-color: white;
              padding: 1.5rem;
              border-radius: 8px;
              box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
              font-family: 'JetBrains Mono', monospace;
              position: relative; 
            }

            .modal-overlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
            }
            
            .modal-close {
              position: absolute;
              top: 1rem;
              right: 1rem;
              font-size: 1.5rem;
              cursor: pointer;
              color: #666;
            }
            
            .modal-close:hover {
            color: #000;
            }
            
            body.modal-open {
            overflow: hidden;
            }
            
            .modal-image-gallery {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            }
            
            .modal-thumb {
            width: 100px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 1px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
            }
            
            .modal-thumb:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            }
        </style>

            <script>
            function openModal(title, htmlContent) {
            const modal = document.getElementById('projectModal');
            const content = document.getElementById('modalContentArea');
            
            content.innerHTML = <h2>${title}</h2>${htmlContent};
            modal.classList.add('active');
            
            // Attach login handler if the modal has the login form
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
              loginForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const pw = document.getElementById('pw').value;
                if (pw === 'dashboard123') {
                  localStorage.setItem('authToken', 'FMu4-X7bHQ-9lW3acpcGZPgABx8_qjeR8fj5EtKnNjY');
                  window.location.href = 'dashboard.html';
                } else {
                  alert('Wrong password');
                }
              });
            }
            }
            
            function closeModal() {
              document.getElementById('projectModal').classList.remove('active');
            }
            
            document.getElementById('projectModal').addEventListener('click', function (e) {
              if (e.target === this) closeModal();
            });
            document.addEventListener('click', function(event) {
              const lightboxOverlay = document.getElementById('lightboxOverlay');
              const img = document.getElementById('lightboxImage');
              const vid = document.getElementById('lightboxVideo');
            
              if (event.target.classList.contains('modal-thumb')) {
                img.src = event.target.getAttribute('src');
                img.style.display = 'block';
                vid.style.display = 'none';
                lightboxOverlay.style.display = 'flex';
              } else if (event.target.classList.contains('modal-video-thumb')) {
                vid.src = event.target.getAttribute('src');
                vid.style.display = 'block';
                img.style.display = 'none';
                lightboxOverlay.style.display = 'flex';
              }
            });

    <script>
        const databricksModalContent = `

        function openModal(buttonEl) {
