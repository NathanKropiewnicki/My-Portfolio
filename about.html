<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/styles/about.css">
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
        <title>Nathan Kropiewnicki</title>
        <style>
            .grid {
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
              gap: 1.5rem;
              margin-top: 2rem;
            }
            
           .modal-overlay {
              display: none;
              position: relative; /* Not fixed */
              z-index: 1;
              margin-top: 1rem;
            }
            
           .modal-overlay.active {
              display: block;
            }
            
            .modal-content {
              background-color: white;
              padding: 1.5rem;
              border-radius: 8px;
              box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
              font-family: 'JetBrains Mono', monospace;
            }
            
            
            .modal-overlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
            }
            
            .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            }
            
            .modal-close:hover {
            color: #000;
            }
            
            body.modal-open {
            overflow: hidden;
            }
            
            .modal-image-gallery {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            }
            
            .modal-thumb {
            width: 100px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 1px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
            }
            
            .modal-thumb:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            }
        </style>
    </head>
    <body>
        <script src="/scripts/glow.js"></script>
        <div class="nav-wrapper">
            <nav class="nav">
                <a href="index.html" ><img src="/assets/svg/home.svg" />Home</a>
                <a href="about.html"><img src="/assets/svg/about.svg" />About</a>
                <a href="projects.html"><img src="/assets/svg/projects.svg" />Projects</a>
                <a href="contact.html"><img src="/assets/svg/contact.svg" />Contact</a>
                <!--<a href="photos.html"><img src="/assets/svg/photos.svg" />Photos</a> -->
                <a href="clips.html"><img src="/assets/svg/photos.svg" />Esports</a>
            </nav>
        </div>
    <div class="container fade-in">
        <div class="left-content">
            <img class="profile-pic" src="/assets/img/smallface.jpg" alt="Face">
            <div class="grid">
              <div class="project">
                <h2>Databricks Dashboard</h2>
                <img src="/assets/img/databricks.png" alt="Databricks Icon" class="project-icon" />
                
                <button onclick="openModal(this)">Learn More</button>
            
                <div class="modal-overlay">
                  <div class="modal-content">
                    <span class="modal-close" onclick="closeModal(this)">&times;</span>
                    <div class="modal-body">
                        <h4>Outcomes</h4>
                    </div>
            <div class="modal-overlay" id="projectModal" role="dialog" aria-modal="true">
            <div class="modal-content">
              <span class="modal-close" onclick="closeModal()">&times;</span>
              <div id="modalContentArea"></div>
            </div>
            </div>
            
            <script>
            function openModal(title, htmlContent) {
            const modal = document.getElementById('projectModal');
            const content = document.getElementById('modalContentArea');
            
            content.innerHTML = `<h2>${title}</h2>${htmlContent}`;
            modal.classList.add('active');
            
            // Attach login handler if the modal has the login form
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
              loginForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const pw = document.getElementById('pw').value;
                if (pw === 'dashboard123') {
                  localStorage.setItem('authToken', 'FMu4-X7bHQ-9lW3acpcGZPgABx8_qjeR8fj5EtKnNjY');
                  window.location.href = 'dashboard.html';
                } else {
                  alert('Wrong password');
                }
              });
            }
            }
            
            function closeModal() {
              document.getElementById('projectModal').classList.remove('active');
            }
            
            document.getElementById('projectModal').addEventListener('click', function (e) {
              if (e.target === this) closeModal();
            });
            document.addEventListener('click', function(event) {
              const lightboxOverlay = document.getElementById('lightboxOverlay');
              const img = document.getElementById('lightboxImage');
              const vid = document.getElementById('lightboxVideo');
            
              if (event.target.classList.contains('modal-thumb')) {
                img.src = event.target.getAttribute('src');
                img.style.display = 'block';
                vid.style.display = 'none';
                lightboxOverlay.style.display = 'flex';
              } else if (event.target.classList.contains('modal-video-thumb')) {
                vid.src = event.target.getAttribute('src');
                vid.style.display = 'block';
                img.style.display = 'none';
                lightboxOverlay.style.display = 'flex';
              }
            });
            <script>
                const databricksModalContent = `
                  <h4>Overview</h4>
                  <p>This is a demo modal for the Databricks dashboard.</p>
                  <!-- Add the rest of your original modal content here -->
                `;
                
                function openModal(buttonEl) {
                  const project = buttonEl.closest('.project');
                  const modal = project.querySelector('.modal-overlay');
                  const content = modal.querySelector('.modal-body');
                  content.innerHTML = databricksModalContent;
                  modal.classList.add('active');
                }
                
                function closeModal(closeBtn) {
                  const modal = closeBtn.closest('.modal-overlay');
                  modal.classList.remove('active');
                }
                </script>
    </div>
    </body>
</html>
